# Fork release: every push to master builds Windows and macOS packages and
# publishes them as a new GitHub release (v1.27.<run number>). The app's
# update check reads the latest release of this repo, so installed fork
# builds see "Update available" after each push.

name: Fork release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: v
        shell: bash
        run: |
          major=$(grep -oP 'set\(DESKFLOW_VERSION_MAJOR \K[0-9]+' CMakeLists.txt)
          minor=$(grep -oP 'set\(DESKFLOW_VERSION_MINOR \K[0-9]+' CMakeLists.txt)
          version="${major}.${minor}.${{ github.run_number }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runs-on }}
    timeout-minutes: 45
    # The Mac package is unsigned and best effort; a Mac failure must not
    # block the Windows release.
    continue-on-error: ${{ matrix.target.optional }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: "windows-x64"
            runs-on: "windows-2022"
            config-args: "-G Ninja"
            vcpkg-triplet: x64-windows-release
            arch: "amd64"
            qt-version: 6.12
            optional: false

          - name: "macos-arm64"
            runs-on: macos-15
            config-args: '-DCMAKE_OSX_ARCHITECTURES="arm64" -DCMAKE_OSX_DEPLOYMENT_TARGET=14'
            qt-version: 6.12
            optional: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # CMake reads the version from `git describe --match v*`, which only
      # sees annotated tags. Tag this commit locally (not pushed) so the
      # build reports exactly the release version.
      - name: Tag build
        shell: bash
        run: |
          git config user.name "fork-release"
          git config user.email "fork-release@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "${{ needs.version.outputs.tag }}"

      - name: Setup VC++ environment
        if: ${{ runner.os == 'Windows' }}
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.target.arch }}
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: ${{ matrix.target.qt-version }}
          vcpkg-triplet: ${{ matrix.target.vcpkg-triplet }}

      # Default shell (pwsh on Windows): under bash the MSVC environment from
      # setup-msvc-dev isn't picked up and CMake finds no C++ compiler.
      - name: Configure
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON
          ${{ matrix.target.config-args }}
          ${{ steps.get-deps.outputs.vcpkg-cmake-config }}
          -DPACKAGE_VERSION_LABEL="${{ needs.version.outputs.version }}"

      - name: Build package
        shell: bash
        run: |
          cmake --build build --config Release -j8
          for i in 1 2 3; do
            cmake --build build --config Release -j8 --target package && exit 0
            echo "Package attempt $i failed"; sleep 2
          done
          exit 1

      # Catch a bundle that macOS would refuse to launch (bad signatures).
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=$(find build/_CPack_Packages -maxdepth 4 -name 'Deskflow.app' -type d | head -1)
          if [ -z "$app" ]; then echo "::warning::staged app not found, skipping check"; exit 0; fi
          echo "Checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|TeamIdentifier|flags'
          ls "$app/Contents/MacOS"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.target.name }}
          path: ${{ github.workspace }}/build/deskflow[-_]*.*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: package-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          ls -l dist
          notes="Fork build of ${GITHUB_SHA::7}.

          Windows: run the .msi.
          macOS: the app is not signed. After copying it to Applications, run
          \`xattr -cr /Applications/Deskflow.app\` once, or right-click it and choose Open."
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$notes" \
            --latest
